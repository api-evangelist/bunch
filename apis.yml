name: Bunch
description: Bunch is a Berlin-based financial technology company building AI-native
  infrastructure for private markets. Its all-in-one platform combines secure data
  infrastructure, AI-powered workflows, and expert fund services so venture capital
  and private equity funds and investors can seamlessly transact, close, and securely
  operate — spanning fund administration, SPV and vehicle setup, investor onboarding
  and KYC, capital calls, and reporting. Bunch was surfaced as a portfolio company
  of 500 Global and Northzone and profiled into the API Evangelist network. Bunch
  operates a private, customer-facing product at app.bunch.capital and does not
  publish a public API, developer portal, or SDKs at this time.
